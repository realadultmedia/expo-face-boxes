plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'media.realadult.faceboxes'
version = '1.0.0'

android {
  namespace "expo.modules.faceboxes"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google ML Kit's face detector, bundled in the app (no Play Services download).
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
